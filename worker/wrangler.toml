name = "senior-scam-checker-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[observability]
enabled = true

# Secrets (never in this file — set with `npx wrangler secret put <NAME>`):
#   GEMINI_API_KEY
#   WHATSAPP_ACCESS_TOKEN   — from the Meta app's WhatsApp > API Setup page
#   WHATSAPP_VERIFY_TOKEN   — any string you choose; Meta echoes it back during webhook setup
[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"
WHATSAPP_PHONE_NUMBER_ID = "1299787523207225"

# Holds Pro license keys for the browser extension. Issue a key after a sale with:
#   npx wrangler kv key put --binding=LICENSES "<key>" "active"
[[kv_namespaces]]
binding = "LICENSES"
id = "775023e87ec94b4099514921dc65e925"
