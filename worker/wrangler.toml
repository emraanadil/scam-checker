name = "senior-scam-checker-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[observability]
enabled = true

# Secrets (never in this file — set with `npx wrangler secret put <NAME>`):
#   GEMINI_API_KEY
#   WHATSAPP_ACCESS_TOKEN   — from the Meta app's WhatsApp > API Setup page
#   WHATSAPP_VERIFY_TOKEN   — any string you choose; Meta echoes it back during webhook setup
[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"
WHATSAPP_PHONE_NUMBER_ID = "1299787523207225"
